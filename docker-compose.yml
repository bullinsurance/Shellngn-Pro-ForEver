services:
  shellngn:
    image: shellngn/pro:latest
    container_name: ${CONTAINER_NAME:-shellngn-pro}
    restart: unless-stopped

    environment:
      - PORT=${PORT:-8080}
      - HOST=${HOST:-0.0.0.0}
      - CORS=${CORS:-*}
      - BASE_URL=${BASE_URL:-/}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_TO_FILE=${LOG_TO_FILE:-false}
      - LOG_DIR=${LOG_DIR:-./logs}
      # Descomentar solo si se necesita, ver README para más detalles
      # - TLS_CERT=${TLS_CERT}
      # - TLS_KEY=${TLS_KEY}
      # - RESET_USER=${RESET_USER}

    volumes:
      - ./data:/home/node/server/data

    ports:
      - "0.0.0.0:${APP_PORT:-8080}:${PORT:-8080}"
